<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>PROTOTYPE — Gather-first workspace</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4ffe4;
        --muted: #9fb2bd;
        --lime: #d9ed92;
        --lime-2: #b5e48c;
        --blue: #48cae4;
        --red: #ff8f8f;
        --bg: #02080d;
        --panel: #06131d;
        --panel-2: #0b1f2d;
        --line: #244254;
        --shadow: 0 18px 48px rgb(0 0 0 / 35%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 0%, rgb(72 202 228 / 10%), transparent 32rem),
          var(--bg);
        color: var(--ink);
        font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button,
      .button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #102938;
        color: var(--ink);
        padding: 0.58rem 0.78rem;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--blue);
      }

      button.primary {
        border-color: var(--lime-2);
        background: var(--lime);
        color: #10200e;
        font-weight: 800;
      }

      button.danger {
        color: var(--red);
      }

      button.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #020b11;
        color: var(--ink);
        padding: 0.7rem;
      }

      textarea {
        min-height: 74px;
        resize: vertical;
      }

      .app {
        min-height: 100vh;
        padding-bottom: 2rem;
      }

      .topbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--line);
        background: rgb(2 8 13 / 92%);
        padding: 0.75rem 1rem;
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--lime);
        border-radius: 10px;
        color: var(--lime);
        font-weight: 900;
      }

      .eyebrow,
      .kicker {
        margin: 0;
        color: var(--lime-2);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(1rem, 2vw, 1.28rem);
      }

      h2 {
        margin-bottom: 0.25rem;
        font-size: 1.2rem;
      }

      h3 {
        margin-bottom: 0.45rem;
        font-size: 1rem;
      }

      .subtitle,
      .helper,
      small {
        color: var(--muted);
      }

      .top-actions,
      .row-actions,
      .section-actions,
      .stage-tabs,
      .usage,
      .badges {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .prototype-banner {
        border-bottom: 1px solid #694d16;
        background: #271c08;
        color: #ffdc86;
        padding: 0.48rem 1rem;
        text-align: center;
        font-size: 0.82rem;
      }

      .workspace {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 1.25rem;
      }

      .panel,
      .fact-card,
      .destination,
      .preview-card,
      .empty-state {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .panel,
      .destination,
      .preview-card,
      .empty-state {
        padding: 1rem;
      }

      .section-head,
      .fact-head,
      .destination-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .stage-tabs {
        margin-bottom: 1rem;
      }

      .stage-tabs button[aria-current="step"] {
        border-color: var(--lime);
        background: #263617;
        color: var(--lime);
      }

      .fact-list,
      .destination-list,
      .attached-list {
        display: grid;
        gap: 0.75rem;
      }

      .fact-card {
        padding: 0.85rem;
      }

      .fact-card.highlight {
        animation: highlight 1.4s ease;
      }

      @keyframes highlight {
        0%,
        60% {
          border-color: var(--lime);
          box-shadow: 0 0 0 4px rgb(217 237 146 / 20%);
        }
      }

      .fact-text {
        margin: 0.65rem 0;
        white-space: pre-wrap;
      }

      .link {
        display: block;
        overflow: hidden;
        color: var(--blue);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        border: 1px solid #385c6d;
        border-radius: 999px;
        background: #102938;
        color: #d8f4ff;
        padding: 0.18rem 0.48rem;
        font-size: 0.74rem;
      }

      .badge.used {
        border-color: #62833f;
        background: #1f3014;
        color: var(--lime);
      }

      .badge.incomplete {
        border-color: #805a2e;
        background: #311f0b;
        color: #ffd38e;
      }

      .fact-editor {
        display: grid;
        gap: 0.65rem;
        margin-top: 0.65rem;
        border-top: 1px solid var(--line);
        padding-top: 0.8rem;
      }

      .global-warning {
        border-left: 3px solid var(--lime);
        background: #142410;
        color: #dff5b3;
        padding: 0.55rem 0.7rem;
      }

      .statement {
        margin-bottom: 0.85rem;
        border-left: 3px solid var(--blue);
        padding-left: 0.8rem;
      }

      .attached-fact {
        border: 1px solid #294b5e;
        border-radius: 9px;
        background: var(--panel-2);
        padding: 0.75rem;
      }

      .attached-fact .fact-text {
        margin-top: 0.3rem;
      }

      .empty-state {
        border-style: dashed;
        color: var(--muted);
        text-align: center;
      }

      .variant-a .stage-shell {
        max-width: 1080px;
        margin: 0 auto;
      }

      .variant-a .step-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .variant-a .step-summary > div {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #071722;
        padding: 0.75rem;
      }

      .variant-a .step-summary strong {
        display: block;
        margin-top: 0.2rem;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .modal-backdrop {
        position: fixed;
        z-index: 50;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 68%);
        padding: 1rem;
      }

      .modal {
        width: min(680px, 100%);
        max-height: 82vh;
        overflow: auto;
        border: 1px solid var(--lime);
        border-radius: 14px;
        background: #06131d;
        box-shadow: var(--shadow);
        padding: 1rem;
      }

      .picker-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.7rem;
        align-items: start;
        border-top: 1px solid var(--line);
        padding: 0.8rem 0;
      }

      .picker-row input {
        width: auto;
        margin-top: 0.25rem;
      }

      @media (max-width: 900px) {
        .topbar,
        .section-head,
        .destination-head {
          align-items: stretch;
          flex-direction: column;
        }

        .preview-grid,
        .variant-a .step-summary {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .workspace {
          padding: 0.75rem;
        }

        .top-actions button {
          flex: 1;
        }

      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /*
       * SELECTED PROTOTYPE — staged gather-first workflow.
       * Rewrite for production; this file intentionally keeps in-memory sample state.
       */

      const destinationDefinitions = {
        situation: { label: "Situation", prompt: "What is happening?" },
        complication: { label: "Complication", prompt: "What changed or makes this matter?" },
        argument1: { label: "Supporting Argument 1", prompt: "Why should someone believe the answer?" },
      };

      function sampleState() {
        return {
          stage: "gather",
          editing: null,
          pickerDestination: null,
          highlightFactId: null,
          facts: [
            {
              id: "fact-1",
              dataType: "fact",
              text: "[Sample] Support teams report repeated manual handoffs.",
              evidenceLink: "https://example.com/support-study",
            },
            {
              id: "fact-2",
              dataType: "observation",
              text: "[Sample] Requests without a named owner remain open longer.",
              evidenceLink: "https://example.com/support-study",
            },
            {
              id: "fact-3",
              dataType: "example",
              text: "[Sample] A shared triage view made ownership visible in a pilot.",
              evidenceLink: "https://example.com/pilot",
            },
            {
              id: "fact-4",
              dataType: "",
              text: "[Incomplete sample] Interview finding to verify.",
              evidenceLink: "",
            },
          ],
          destinations: {
            situation: {
              statement: "Support requests currently pass through several teams.",
              factIds: ["fact-1"],
            },
            complication: {
              statement: "Fragmented ownership creates delay and inconsistent follow-up.",
              factIds: ["fact-2", "fact-1"],
            },
            argument1: {
              statement: "Use one shared triage workspace with explicit ownership.",
              factIds: ["fact-3"],
            },
          },
        };
      }

      function emptyState() {
        return {
          stage: "gather",
          editing: null,
          pickerDestination: null,
          highlightFactId: null,
          facts: [],
          destinations: {
            situation: { statement: "", factIds: [] },
            complication: { statement: "", factIds: [] },
            argument1: { statement: "", factIds: [] },
          },
        };
      }

      let state = sampleState();
      let nextFactNumber = 5;

      function isComplete(fact) {
        if (!fact.text.trim()) return false;
        try {
          const url = new URL(fact.evidenceLink);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function usageFor(factId) {
        return Object.entries(state.destinations)
          .filter(([, destination]) => destination.factIds.includes(factId))
          .map(([key]) => ({ key, label: destinationDefinitions[key].label }));
      }

      function factById(factId) {
        return state.facts.find((fact) => fact.id === factId);
      }

      function escapeHtml(value = "") {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function typeLabel(value) {
        return {
          "": "Unspecified",
          fact: "Fact",
          observation: "Observation",
          example: "Example",
          estimate: "Estimate",
        }[value];
      }

      function usageMarkup(fact) {
        const uses = usageFor(fact.id);
        return `
          <div class="usage" aria-label="Fact usage">
            <span class="badge ${uses.length ? "used" : ""}">${uses.length ? `Used in ${uses.length} ${uses.length === 1 ? "place" : "places"}` : "Unused"}</span>
            ${uses.map((use) => `<span class="badge">${escapeHtml(use.label)}</span>`).join("")}
          </div>
        `;
      }

      function factEditor(fact, context) {
        const uses = usageFor(fact.id);
        return `
          <form class="fact-editor" data-fact-id="${fact.id}" data-edit-context="${escapeHtml(context)}">
            ${uses.length ? `<div class="global-warning">Used in ${uses.length} ${uses.length === 1 ? "place" : "places"}—changes update all uses.</div>` : ""}
            <label>
              <span class="kicker">Fact text</span>
              <textarea name="text">${escapeHtml(fact.text)}</textarea>
            </label>
            <label>
              <span class="kicker">Evidence link</span>
              <input name="evidenceLink" type="url" value="${escapeHtml(fact.evidenceLink)}" />
            </label>
            <label>
              <span class="kicker">Data type</span>
              <select name="dataType">
                ${["", "fact", "observation", "example", "estimate"].map((value) => `<option value="${value}" ${fact.dataType === value ? "selected" : ""}>${typeLabel(value)}</option>`).join("")}
              </select>
            </label>
            <div class="row-actions">
              <button class="primary" type="button" data-action="save-fact">Save fact</button>
              <button type="button" data-action="cancel-edit">Cancel</button>
            </div>
          </form>
        `;
      }

      function factCard(fact, compact = false) {
        const context = "library";
        const editing = state.editing?.factId === fact.id && state.editing?.context === context;
        return `
          <article class="fact-card ${state.highlightFactId === fact.id ? "highlight" : ""}" id="library-${fact.id}">
            <div class="fact-head">
              <div class="badges">
                <span class="badge">${typeLabel(fact.dataType)}</span>
                ${isComplete(fact) ? "" : '<span class="badge incomplete">Incomplete—not selectable</span>'}
              </div>
              ${usageMarkup(fact)}
            </div>
            ${editing ? factEditor(fact, context) : `
              <p class="fact-text">${escapeHtml(fact.text) || "<em>Blank fact draft</em>"}</p>
              <span class="link">${escapeHtml(fact.evidenceLink) || "No evidence link yet"}</span>
              <div class="row-actions">
                <button type="button" data-action="edit-fact" data-fact-id="${fact.id}" data-edit-context="${context}">Edit fact</button>
                <button type="button" data-action="another-source" data-fact-id="${fact.id}" ${fact.evidenceLink ? "" : "disabled"}>Another fact from this source</button>
                <button class="danger" type="button" data-action="delete-fact" data-fact-id="${fact.id}">Delete</button>
              </div>
            `}
          </article>
        `;
      }

      function gatheredFactsPanel(compact = false) {
        return `
          <section class="panel">
            <div class="section-head">
              <div>
                <p class="kicker">Stage 1</p>
                <h2>Gathered Facts</h2>
                <p class="helper">Collect the evidence first. Complete facts can be selected anywhere on the board.</p>
              </div>
              <button class="primary" type="button" data-action="add-fact">+ Fact</button>
            </div>
            <div class="fact-list">
              ${state.facts.length ? state.facts.map((fact) => factCard(fact, compact)).join("") : `
                <div class="empty-state">
                  <h3>No facts gathered yet</h3>
                  <p>Add the first fact and its evidence link, or continue to construct a reasoning-only argument.</p>
                  <button class="primary" type="button" data-action="add-fact">Add first fact</button>
                </div>
              `}
            </div>
          </section>
        `;
      }

      function attachedFact(fact, destinationKey, index) {
        const context = `destination:${destinationKey}`;
        const editing = state.editing?.factId === fact.id && state.editing?.context === context;
        return `
          <article class="attached-fact">
            <div class="fact-head">
              <div class="badges">
                <span class="badge">${index + 1}</span>
                <span class="badge">${typeLabel(fact.dataType)}</span>
                ${isComplete(fact) ? "" : '<span class="badge incomplete">Incomplete</span>'}
              </div>
              <span class="badge used">${usageFor(fact.id).length} total ${usageFor(fact.id).length === 1 ? "use" : "uses"}</span>
            </div>
            ${editing ? factEditor(fact, context) : `
              <p class="fact-text">${escapeHtml(fact.text) || "<em>Blank fact draft</em>"}</p>
              <span class="link">${escapeHtml(fact.evidenceLink) || "No evidence link yet"}</span>
              <div class="row-actions">
                <button type="button" data-action="move-attachment" data-destination="${destinationKey}" data-fact-id="${fact.id}" data-direction="up" ${index === 0 ? "disabled" : ""}>↑</button>
                <button type="button" data-action="move-attachment" data-destination="${destinationKey}" data-fact-id="${fact.id}" data-direction="down" ${index === state.destinations[destinationKey].factIds.length - 1 ? "disabled" : ""}>↓</button>
                <button type="button" data-action="edit-fact" data-fact-id="${fact.id}" data-edit-context="${context}">Edit fact</button>
                <button type="button" data-action="open-fact" data-fact-id="${fact.id}">Open in Gathered Facts</button>
                <button type="button" data-action="remove-attachment" data-destination="${destinationKey}" data-fact-id="${fact.id}">Remove from here</button>
              </div>
            `}
          </article>
        `;
      }

      function destinationCard(key) {
        const definition = destinationDefinitions[key];
        const destination = state.destinations[key];
        return `
          <article class="destination">
            <div class="destination-head">
              <div>
                <span class="kicker">${definition.prompt}</span>
                <h3>${definition.label}</h3>
              </div>
              <div class="section-actions">
                <button type="button" data-action="choose-facts" data-destination="${key}">Choose Gathered Facts</button>
                <button type="button" data-action="create-here" data-destination="${key}">Create new fact here</button>
              </div>
            </div>
            <p class="statement">${escapeHtml(destination.statement) || "<em>Short storytelling statement goes here.</em>"}</p>
            <div class="attached-list">
              ${destination.factIds.length
                ? destination.factIds.map((factId, index) => attachedFact(factById(factId), key, index)).join("")
                : '<div class="empty-state">No facts attached. This statement can remain evidence-free while drafting.</div>'}
            </div>
          </article>
        `;
      }

      function constructPanel() {
        return `
          <section class="panel">
            <div class="section-head">
              <div>
                <p class="kicker">Stage 2</p>
                <h2>Construct Argument</h2>
                <p class="helper">Keep the short story clear, then choose the facts that support each part.</p>
              </div>
            </div>
            <div class="destination-list">
              ${Object.keys(destinationDefinitions).map(destinationCard).join("")}
            </div>
          </section>
        `;
      }

      function previewPanel() {
        return `
          <section class="panel">
            <div class="section-head">
              <div>
                <p class="kicker">Read-only</p>
                <h2>Argument Preview</h2>
                <p class="helper">Facts follow each destination's chosen order. Editing stays outside Preview.</p>
              </div>
            </div>
            <div class="preview-grid">
              ${Object.entries(destinationDefinitions).map(([key, definition]) => {
                const destination = state.destinations[key];
                return `
                  <article class="preview-card">
                    <span class="kicker">${definition.label}</span>
                    <h3>${escapeHtml(destination.statement) || "No statement yet"}</h3>
                    <ol>
                      ${destination.factIds.map((id) => `<li>${escapeHtml(factById(id)?.text || "Missing fact")}</li>`).join("") || "<li>No facts attached</li>"}
                    </ol>
                  </article>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }

      function stageTabs() {
        return `
          <nav class="stage-tabs" aria-label="Workflow stages">
            <button type="button" data-action="set-stage" data-stage="gather" aria-current="${state.stage === "gather" ? "step" : "false"}">1. Gather Facts</button>
            <button type="button" data-action="set-stage" data-stage="construct" aria-current="${state.stage === "construct" ? "step" : "false"}">2. Construct Argument</button>
            <button type="button" data-action="set-stage" data-stage="preview" aria-current="${state.stage === "preview" ? "step" : "false"}">3. Preview</button>
          </nav>
        `;
      }

      function selectedWorkflow() {
        return `
          <div class="workspace variant-a">
            <div class="stage-shell">
              ${stageTabs()}
              <div class="step-summary" aria-label="Workflow summary">
                <div><span class="kicker">Gathered</span><strong>${state.facts.length} facts</strong></div>
                <div><span class="kicker">Complete</span><strong>${state.facts.filter(isComplete).length} selectable</strong></div>
                <div><span class="kicker">Used</span><strong>${state.facts.filter((fact) => usageFor(fact.id).length).length} facts</strong></div>
              </div>
              ${state.stage === "gather" ? gatheredFactsPanel() : state.stage === "construct" ? constructPanel() : previewPanel()}
            </div>
          </div>
        `;
      }

      function picker() {
        if (!state.pickerDestination) return "";
        const destination = state.destinations[state.pickerDestination];
        const label = destinationDefinitions[state.pickerDestination].label;
        return `
          <div class="modal-backdrop">
            <section class="modal" role="dialog" aria-modal="true" aria-labelledby="picker-title">
              <div class="section-head">
                <div>
                  <p class="kicker">Choose existing evidence</p>
                  <h2 id="picker-title">Add facts to ${label}</h2>
                </div>
                <button type="button" data-action="close-picker">Close</button>
              </div>
              ${state.facts.map((fact) => {
                const attached = destination.factIds.includes(fact.id);
                const complete = isComplete(fact);
                return `
                  <label class="picker-row">
                    <input type="checkbox" name="picked-fact" value="${fact.id}" ${attached ? "checked disabled" : ""} ${complete ? "" : "disabled"} />
                    <span>
                      <strong>${escapeHtml(fact.text) || "Blank fact"}</strong>
                      <span class="link">${escapeHtml(fact.evidenceLink) || "Incomplete—add a valid evidence link first"}</span>
                      ${attached ? '<span class="badge used">Already attached</span>' : complete ? "" : '<span class="badge incomplete">Not selectable</span>'}
                    </span>
                  </label>
                `;
              }).join("") || '<div class="empty-state">No Gathered Facts yet. Close this dialog and create one here instead.</div>'}
              <div class="row-actions">
                <button class="primary" type="button" data-action="attach-selected">Attach selected facts</button>
                <button type="button" data-action="close-picker">Cancel</button>
              </div>
            </section>
          </div>
        `;
      }

      function render() {
        document.querySelector("#app").innerHTML = `
          <div class="app">
            <div class="prototype-banner">THROWAWAY PROTOTYPE — sample claims and example.com links are fictional interaction data.</div>
            <header class="topbar">
              <div class="brand">
                <div class="mark">AM</div>
                <div>
                  <p class="eyebrow">Argument Maker</p>
                  <h1>Gather-first workspace</h1>
                </div>
              </div>
              <div class="top-actions">
                <button type="button" data-action="load-sample">Working example</button>
                <button type="button" data-action="reset-empty">Empty first-use state</button>
              </div>
            </header>
            ${selectedWorkflow()}
            ${picker()}
          </div>
        `;

        if (state.pickerDestination) {
          setTimeout(() => document.querySelector(".modal button")?.focus(), 0);
        }

        if (state.highlightFactId) {
          const factId = state.highlightFactId;
          setTimeout(() => document.querySelector(`#library-${factId}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
          state.highlightFactId = null;
        }
      }

      function addFact({ evidenceLink = "", destination = null } = {}) {
        const fact = {
          id: `fact-${nextFactNumber++}`,
          dataType: "",
          text: "",
          evidenceLink,
        };
        state.facts.push(fact);
        if (destination) state.destinations[destination].factIds.push(fact.id);
        const context = destination ? `destination:${destination}` : "library";
        state.editing = { factId: fact.id, context };
        if (!destination) {
          state.stage = "gather";
        }
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;

        if (action === "set-stage") {
          state.stage = button.dataset.stage;
          render();
        } else if (action === "load-sample") {
          state = sampleState();
          nextFactNumber = 5;
          render();
        } else if (action === "reset-empty") {
          state = emptyState();
          nextFactNumber = 1;
          render();
        } else if (action === "add-fact") {
          addFact();
          render();
        } else if (action === "another-source") {
          addFact({ evidenceLink: factById(button.dataset.factId).evidenceLink });
          render();
        } else if (action === "edit-fact") {
          state.editing = { factId: button.dataset.factId, context: button.dataset.editContext };
          render();
        } else if (action === "cancel-edit") {
          state.editing = null;
          render();
        } else if (action === "save-fact") {
          const form = button.closest(".fact-editor");
          const fact = factById(form.dataset.factId);
          fact.text = form.elements.text.value;
          fact.evidenceLink = form.elements.evidenceLink.value;
          fact.dataType = form.elements.dataType.value;
          state.editing = null;
          render();
        } else if (action === "open-fact") {
          state.stage = "gather";
          state.highlightFactId = button.dataset.factId;
          render();
        } else if (action === "delete-fact") {
          const factId = button.dataset.factId;
          const uses = usageFor(factId);
          const message = uses.length
            ? `Delete this fact and remove it from ${uses.length} places?\n\nAffected: ${uses.map((use) => use.label).join(", ")}`
            : "Delete this unused fact?";
          if (confirm(message)) {
            state.facts = state.facts.filter((fact) => fact.id !== factId);
            Object.values(state.destinations).forEach((destination) => {
              destination.factIds = destination.factIds.filter((id) => id !== factId);
            });
            render();
          }
        } else if (action === "choose-facts") {
          state.pickerDestination = button.dataset.destination;
          render();
        } else if (action === "close-picker") {
          state.pickerDestination = null;
          render();
        } else if (action === "attach-selected") {
          const destination = state.destinations[state.pickerDestination];
          document.querySelectorAll('input[name="picked-fact"]:checked:not(:disabled)').forEach((input) => {
            if (!destination.factIds.includes(input.value)) destination.factIds.push(input.value);
          });
          state.pickerDestination = null;
          render();
        } else if (action === "create-here") {
          addFact({ destination: button.dataset.destination });
          render();
        } else if (action === "remove-attachment") {
          const destination = state.destinations[button.dataset.destination];
          destination.factIds = destination.factIds.filter((id) => id !== button.dataset.factId);
          render();
        } else if (action === "move-attachment") {
          const destination = state.destinations[button.dataset.destination];
          const index = destination.factIds.indexOf(button.dataset.factId);
          const targetIndex = button.dataset.direction === "up" ? index - 1 : index + 1;
          if (targetIndex >= 0 && targetIndex < destination.factIds.length) {
            [destination.factIds[index], destination.factIds[targetIndex]] = [destination.factIds[targetIndex], destination.factIds[index]];
          }
          render();
        }
      });

      render();
    </script>
  </body>
</html>
